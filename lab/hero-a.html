<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero A · Diorama</title>
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <style>
    :root {
      --ink: #1f2fd1;
      --deep: #18229f;
      --paper: #f2f0ea;
      --soft: rgba(242, 240, 234, 0.66);
      --rule: rgba(242, 240, 234, 0.22);
      --pad: clamp(20px, 2.6vw, 44px);
      --gap: clamp(14px, 1.8vw, 28px);
      --ease-out: cubic-bezier(0.19, 1, 0.22, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--deep);
      color: var(--paper);
      font: 400 16px/1.45 "Archivo", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    h1, p { margin: 0; font-weight: inherit; }

    .hero {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      /* A soft studio light behind the island, nothing more */
      background:
        radial-gradient(60% 70% at 68% 42%, #2232c4 0%, rgba(34, 50, 196, 0) 70%),
        var(--deep);
    }

    .stage { position: absolute; inset: 0; cursor: pointer; }
    .stage canvas { display: block; }
    .stage svg { position: absolute; right: 6%; top: 14%; width: 52%; height: 60%; }

    .nav {
      position: absolute;
      inset: 0 0 auto 0;
      z-index: 3;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 22px var(--pad);
      font-size: 14px;
      font-weight: 500;
    }
    .nav__name { font-weight: 600; letter-spacing: -0.01em; }
    .nav__links { display: flex; gap: clamp(20px, 2.6vw, 40px); color: var(--soft); }
    .nav__links a:hover { color: var(--paper); }
    .nav__cta { justify-self: end; border-bottom: 1px solid currentColor; padding-bottom: 2px; }

    .copy {
      position: absolute;
      z-index: 2;
      left: var(--pad);
      bottom: clamp(112px, 15vh, 150px);
      width: min(46vw, 640px);
      pointer-events: none;
    }
    .copy a { pointer-events: auto; }

    .status {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
      color: var(--soft);
      margin-bottom: clamp(18px, 2.4vh, 28px);
    }
    .status b { display: inline-flex; align-items: center; gap: 9px; color: var(--paper); font-weight: 500; }
    .status b::before { content: ""; width: 7px; height: 7px; background: var(--paper); }
    .status i { width: 28px; height: 1px; background: var(--rule); }

    h1 {
      font-size: clamp(56px, 8.4vw, 148px);
      font-stretch: 108%;
      font-weight: 560;
      letter-spacing: -0.05em;
      line-height: 0.86;
      margin-left: -0.05em;
    }

    .lede {
      margin-top: clamp(18px, 2.6vh, 30px);
      max-width: 27ch;
      font-size: clamp(19px, 1.6vw, 25px);
      line-height: 1.25;
      letter-spacing: -0.012em;
      color: var(--soft);
    }
    .lede b { color: var(--paper); font-weight: 500; }

    .cta { display: flex; align-items: center; gap: 26px; margin-top: clamp(24px, 3.4vh, 40px); }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      height: 52px;
      padding: 0 20px 0 22px;
      background: var(--paper);
      color: var(--ink);
      font-weight: 600;
      font-size: 15px;
      border-radius: 2px;
      transition: transform 160ms var(--ease-out);
    }
    .btn:active { transform: scale(0.97); }
    .btn i { font-style: normal; transition: transform 300ms var(--ease-out); }
    .btn:hover i { transform: translateX(4px); }
    .link { font-size: 15px; font-weight: 500; border-bottom: 1px solid var(--rule); padding-bottom: 3px; }
    .link:hover { border-color: var(--paper); }

    .bar {
      position: absolute;
      z-index: 2;
      left: var(--pad);
      right: var(--pad);
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: var(--gap);
      padding: 18px 0 26px;
      border-top: 1px solid var(--rule);
      font-size: 14px;
    }
    .bar span { grid-column: span 2; color: var(--soft); white-space: nowrap; }
    .bar span em { font-style: normal; color: var(--paper); margin-left: 10px; font-weight: 500; }
    .bar span:first-child { grid-column: 1 / span 2; color: var(--soft); }
    .bar .hint { grid-column: 11 / span 2; text-align: right; }

    /* load-in */
    .copy > *, .bar, .nav { opacity: 0; transform: translateY(14px); transition: opacity 900ms ease, transform 1100ms var(--ease-out); }
    .is-ready .copy > *, .is-ready .bar, .is-ready .nav { opacity: 1; transform: none; }
    .is-ready .copy > :nth-child(1) { transition-delay: 250ms; }
    .is-ready .copy > :nth-child(2) { transition-delay: 330ms; }
    .is-ready .copy > :nth-child(3) { transition-delay: 430ms; }
    .is-ready .copy > :nth-child(4) { transition-delay: 520ms; }
    .is-ready .bar { transition-delay: 650ms; }

    @media (max-width: 760px) {
      .nav { grid-template-columns: 1fr auto; padding-top: 16px; }
      .nav__links { display: none; }
      .copy { width: auto; right: var(--pad); bottom: 132px; }
      h1 { font-size: 17vw; }
      .bar { grid-template-columns: 1fr 1fr; row-gap: 6px; padding-bottom: 20px; }
      .bar span, .bar span:first-child { grid-column: auto; }
      .bar span:first-child, .bar .hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .copy > *, .bar, .nav { transition: opacity 300ms ease; transform: none; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="stage" aria-label="Voxel island. Click to rebuild." role="button" tabindex="0"></div>

    <header class="nav">
      <a class="nav__name" href="#">Your Name</a>
      <nav class="nav__links"><a href="#">Work</a><a href="#">Services</a><a href="#">About</a><a href="#">Contact</a></nav>
      <a class="nav__cta" href="#">Get in touch</a>
    </header>

    <div class="copy">
      <p class="status"><b>Open for commissions</b><i></i><span>CET, UTC+1</span></p>
      <h1>Your Name</h1>
      <p class="lede"><b>Roblox developer.</b> Scripting, building, modeling and UI for games that feel finished.</p>
      <div class="cta">
        <a class="btn" href="#">Start a project <i aria-hidden="true">&rarr;</i></a>
        <a class="link" href="#">View work</a>
      </div>
    </div>

    <div class="bar">
      <span>What I do</span>
      <span>01<em>Scripting</em></span>
      <span>02<em>Building</em></span>
      <span>03<em>Modeling</em></span>
      <span>04<em>UI</em></span>
      <span class="hint">Click the island</span>
    </div>
  </section>

  <script src="../voxel.js"></script>
  <script type="module">
    import { createDiorama } from "../diorama.js";

    const stage = document.querySelector(".stage");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const dio = createDiorama(stage, {
      reduceMotion: reduce,
      focus: (w, h) => (w < 760
        ? { x: 0.5, y: 0.36, scale: 0.9 }
        : { x: 0.69, y: 0.47, scale: Math.min(1, (w / h) / 1.9) * 0.8 }),
    });

    if (!dio) {
      stage.innerHTML = window.Voxel.render({ n: 13, maxH: 6, seed: 7, pal: window.Voxel.PALETTES.ink });
    } else {
      const go = () => dio.rebuild();
      stage.addEventListener("click", go);
      stage.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    }

    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() =>
      requestAnimationFrame(() => document.body.classList.add("is-ready")));
  </script>
</body>
</html>
