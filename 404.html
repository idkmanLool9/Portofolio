<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Your Name</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f2fd1">
  <link rel="icon" href="/Portofolio/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/Portofolio/assets/fonts/fonts.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px clamp(18px, 2.4vw, 40px) clamp(24px, 3vw, 40px);
      background: #1f2fd1;
      color: #f2f0ea;
      font: 400 16px/1.45 "Archivo", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; }
    h1 {
      margin: 0;
      font-size: clamp(120px, 30vw, 520px);
      font-stretch: 125%;
      font-weight: 640;
      letter-spacing: -0.06em;
      line-height: 0.8;
      margin-left: -0.04em;
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(242, 240, 234, 0.24);
    }
    footer p { margin: 0; max-width: 36ch; color: rgba(242, 240, 234, 0.62); }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      height: 50px;
      padding: 0 18px 0 20px;
      background: #f2f0ea;
      color: #1f2fd1;
      font-weight: 600;
      text-decoration: none;
      border-radius: 2px;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <header><a href="/Portofolio/" style="text-decoration:none">Your Name</a><span>Error 404</span></header>
  <h1>404</h1>
  <footer>
    <p>This page does not exist. It may have moved, or the link has a typo.</p>
    <a class="btn" href="/Portofolio/">Back to home <span aria-hidden="true">&rarr;</span></a>
  </footer>
</body>
</html>
